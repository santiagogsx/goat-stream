# Publishes a Goat Stream release: push a tag like v1.1.0 and GitHub builds everything.
#   git tag v1.1.0 && git push origin v1.1.0
# - Windows installer (+ latest.yml, which the PC app's auto-updater reads)
# - Android TV APK (the TV app's updater downloads it) + Google Play bundle + Amazon APK
# - LG / Samsung / Roku packages, and the Xbox test package + Microsoft Store upload file
# They all land on the GitHub release page, which is also your public download link.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # built-in cloud keys come from a repository secret, so they never sit in the public code
      - name: Build in cloud keys
        run: node scripts/inject-keys.js
        env:
          GOAT_CONFIG_JSON: ${{ secrets.GOAT_CONFIG_JSON }}
      - name: Build & publish installer
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm ci
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis --publish always \
            -c.publish.provider=github -c.publish.owner="${GITHUB_REPOSITORY_OWNER}" -c.publish.repo="${GITHUB_REPOSITORY#*/}" \
            -c.publish.releaseType=release

  smart-tvs:
    needs: windows          # LG (webOS .ipk), Samsung (Tizen project) and Roku (.zip) packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build in public cloud IDs (never secrets)
        run: node scripts/inject-keys.js
        env:
          GOAT_CONFIG_JSON: ${{ secrets.GOAT_CONFIG_JSON }}
      - name: Build packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"

          # LG webOS: the shared UI + appinfo.json -> .ipk
          mkdir -p build/lg && cp -r web/. build/lg/ && cp lg-tv/* build/lg/
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" build/lg/appinfo.json
          npx -y -p @webos-tools/cli ares-package build/lg -o "$OUT/lg"
          cp "$OUT"/lg/*.ipk "$OUT/GoatStream-LG.ipk"

          # Samsung Tizen: ready-to-open project (signing needs your Samsung certificate in Tizen Studio)
          mkdir -p build/samsung && cp -r web/. build/samsung/ && cp samsung-tv/* build/samsung/
          sed -i "s/version=\"[0-9.]*\" viewmodes/version=\"$VERSION\" viewmodes/" build/samsung/config.xml
          (cd build/samsung && zip -qr "$OUT/GoatStream-Samsung-project.zip" .)

          # Roku: manifest at the zip root, ready to sideload
          mkdir -p build/roku && cp -r roku/. build/roku/
          sed -i "s/^major_version=.*/major_version=$MAJOR/; s/^minor_version=.*/minor_version=$MINOR/; s/^build_version=.*/build_version=$PATCH/" build/roku/manifest
          (cd build/roku && zip -qr "$OUT/GoatStream-Roku.zip" .)
          ls -la "$OUT"
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/out/GoatStream-LG.ipk
            ${{ runner.temp }}/out/GoatStream-Samsung-project.zip
            ${{ runner.temp }}/out/GoatStream-Roku.zip

  xbox:
    needs: windows          # Xbox app: test package for Developer Mode + Store upload file (steps live in xbox.yml)
    uses: ./.github/workflows/xbox.yml
    with:
      release: true
    secrets: inherit

  android-tv:
    needs: windows          # the Windows job creates the release page; the TV files are added to it (steps live in android-tv.yml)
    uses: ./.github/workflows/android-tv.yml
    with:
      release: true
    secrets: inherit
