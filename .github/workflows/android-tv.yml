# Builds the Android TV app (android-tv/) in two versions:
#   GoatStream-TV.apk             GitHub download, updates itself (the link the TV app and the TV page use)
#   GoatStream-TV-GooglePlay.aab  for the Google Play Console (Google Play updates it)
#   GoatStream-TV-Amazon.apk      for the Amazon Appstore / Fire TV (Amazon updates it)
# - By hand: GitHub -> Actions -> "Android TV build" -> Run workflow (files under the run's "Artifacts"; nothing released).
# - On every release: release.yml runs this and attaches the files to the release.
name: Android TV build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build in cloud keys
        run: node scripts/inject-keys.js
        env:
          GOAT_CONFIG_JSON: ${{ secrets.GOAT_CONFIG_JSON }}
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GOAT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/goat.jks"
            echo "GOAT_KEYSTORE=$RUNNER_TEMP/goat.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::GOAT_KEYSTORE_BASE64 secret missing - TV updates won't install over older versions. See README."
          fi
      - name: Build APKs and the Google Play bundle
        working-directory: android-tv
        env:
          GOAT_KEYSTORE_PASSWORD: ${{ secrets.GOAT_KEYSTORE_PASSWORD }}
          GOAT_KEY_ALIAS: ${{ secrets.GOAT_KEY_ALIAS }}
          GOAT_KEY_PASSWORD: ${{ secrets.GOAT_KEY_PASSWORD }}
          IS_RELEASE: ${{ inputs.release }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.0.0"; fi
          gradle :app:assembleGithubRelease :app:assembleStoreRelease :app:bundleStoreRelease -PversionName="$VERSION"
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          cp app/build/outputs/apk/github/release/app-github-release.apk "$OUT/GoatStream-TV-v$VERSION.apk"
          # same file under a fixed name, so this link always gets the newest version:
          # https://github.com/<you>/goat-stream/releases/latest/download/GoatStream-TV.apk
          cp app/build/outputs/apk/github/release/app-github-release.apk "$OUT/GoatStream-TV.apk"
          cp app/build/outputs/bundle/storeRelease/app-store-release.aab "$OUT/GoatStream-TV-GooglePlay.aab"
          cp app/build/outputs/apk/store/release/app-store-release.apk "$OUT/GoatStream-TV-Amazon.apk"
          ls -la "$OUT"
      - name: Keep the files on this run's page
        uses: actions/upload-artifact@v4
        with:
          name: GoatStream-TV
          path: ${{ runner.temp }}/out/
      - name: Attach to the release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/out/GoatStream-TV-v*.apk
            ${{ runner.temp }}/out/GoatStream-TV.apk
            ${{ runner.temp }}/out/GoatStream-TV-GooglePlay.aab
            ${{ runner.temp }}/out/GoatStream-TV-Amazon.apk
